name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
      profile:
        description: 'EAS build profile (see eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      wait:
        description: 'Wait for build to finish?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    name: Build ${{ inputs.platform }} · ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Quality gates (lint + typecheck)
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build with EAS
        env:
          WAIT_FLAG: ${{ inputs.wait == 'true' && '' || '--no-wait' }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            $WAIT_FLAG